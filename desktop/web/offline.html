<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artema Portal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/theme.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; }
  img { height: 30px; margin-bottom: 40px; }
  h1 { font-size: 32px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 10px; }
  p { color: var(--muted); font-size: 16px; margin: 0 auto 28px; max-width: 420px; }
  .spin { width: 22px; height: 22px; margin: 0 auto 26px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--amber); animation: sp .9s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
<div>
  <img src="/assets/logo-light.webp" alt="Artema">
  <div class="spin"></div>
  <h1>Can't reach the main computer.</h1>
  <p>Check that it's switched on and on the same Wi-Fi. This will reconnect on its own.</p>
  <div class="row"><button class="btn primary big" id="retry">Try again</button><button class="btn big" id="setup">Setup and status</button></div>
</div>
<script>
  const to = new URLSearchParams(location.search).get('to') || '';
  const origin = (() => { try { return new URL(to).origin; } catch { return ''; } })();
  const go = () => { if (to) location.href = to; };
  document.getElementById('retry').onclick = go;
  document.getElementById('setup').onclick = () => { location.href = '/'; };
  setInterval(() => { if (origin) fetch(origin + '/api/info', { mode: 'no-cors' }).then(go).catch(() => { }); }, 3000);
</script>
</body>
</html>
